<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ninibear 动动钟</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFF6EC">
<style>
  :root{
    --bg:#FFF6EC; --card:#FFFFFF; --brown:#8B5E3C; --brown-dark:#6B4226;
    --honey:#F2B33D; --honey-light:#FBE3B5; --pink:#F7C6C4; --green:#9CCB86;
    --shadow:0 6px 18px rgba(139,94,60,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:var(--bg); color:var(--brown-dark);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  h1{font-size:20px; color:var(--brown); margin:8px 0 2px; letter-spacing:1px;}
  .subtitle{font-size:13px; color:#B08A68; margin-bottom:14px;}

  .stage{
    width:min(74vw,290px); height:min(62vw,240px);
    background:radial-gradient(circle at 50% 38%, #FFFDF8, #FBEEDB);
    border-radius:36px; box-shadow:var(--shadow), inset 0 -10px 24px rgba(242,179,61,.18);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    margin-bottom:6px;
  }
  .stage img{width:86%; height:86%; object-fit:contain;
    filter:drop-shadow(0 6px 8px rgba(139,94,60,.18));}

  .timer{
    font-size:56px; font-weight:700; color:var(--brown);
    font-variant-numeric:tabular-nums; letter-spacing:2px; margin:4px 0 2px;
  }
  .timer-label{font-size:13px; color:#B08A68; margin-bottom:14px;}

  .btn{
    border:none; border-radius:999px; font-size:17px; font-weight:600;
    padding:14px 44px; cursor:pointer; transition:transform .12s ease;
  }
  .btn:active{transform:scale(.95);}
  .btn-primary{background:var(--honey); color:#5C3A17; box-shadow:0 4px 0 #D99A22;}
  .btn-ghost{background:#F3E4D2; color:var(--brown); box-shadow:0 4px 0 #DEC3A6;}
  .btn-row{display:flex; gap:12px; margin-bottom:18px;}

  .card{
    width:100%; max-width:420px; background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;
  }
  .card-title{font-size:15px; font-weight:700; color:var(--brown); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .card-title small{font-weight:400; color:#B08A68; font-size:12px;}

  .med-row{display:flex; gap:12px;}
  .med-btn{
    flex:1; border:2px solid #EBDCC8; background:#FFFBF5; border-radius:16px;
    padding:14px 8px; text-align:center; cursor:pointer; transition:all .15s ease;
  }
  .med-btn .med-icon{font-size:26px; display:block; margin-bottom:4px;}
  .med-btn .med-name{font-size:15px; font-weight:600; color:var(--brown);}
  .med-btn .med-state{font-size:12px; color:#B08A68; margin-top:2px;}
  .med-btn.done{background:#F1F8EC; border-color:var(--green);}
  .med-btn.done .med-state{color:#5E9A48; font-weight:600;}

  .slider-row{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--brown);}
  input[type=range]{flex:1; accent-color:var(--honey); height:28px;}
  .range-val{font-weight:700; min-width:64px; text-align:right; font-variant-numeric:tabular-nums;}

  .stats{display:flex; gap:10px; margin-top:2px;}
  .stat{flex:1; background:#FFFBF5; border-radius:14px; padding:10px; text-align:center;}
  .stat .num{font-size:22px; font-weight:700; color:var(--honey);}
  .stat .lbl{font-size:12px; color:#B08A68;}

  .overlay{
    position:fixed; inset:0; background:rgba(107,66,38,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:24px;
    backdrop-filter:blur(4px);
  }
  .overlay.show{display:flex;}
  .overlay-card{
    background:var(--bg); border-radius:26px; padding:28px 24px; text-align:center;
    width:100%; max-width:340px; box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .overlay-card img{width:150px; margin:-6px auto 4px; display:block;}
  .overlay-card h2{font-size:21px; color:var(--brown); margin-bottom:6px;}
  .overlay-card p{font-size:14px; color:#B08A68; margin-bottom:18px; line-height:1.6;}
  .hint{font-size:12px; color:#C4A586; text-align:center; max-width:420px; line-height:1.7;}
</style>
</head>
<body>

<h1>🐻 Ninibear 动动钟</h1>
<div class="subtitle">小熊陪你专注，到点记得起来动动～</div>

<div class="stage" id="stage">
  <img id="bearImg" src="ninibear-idle.png" alt="Ninibear">
</div>

<div class="timer" id="timerDisplay">35:00</div>
<div class="timer-label" id="timerLabel">每 35 分钟起来活动一次</div>

<div class="btn-row">
  <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">开始</button>
  <button class="btn btn-ghost" onclick="resetTimer()">重置</button>
</div>

<div class="card">
  <div class="card-title">💊 今天吃药了吗 <small id="medDate"></small></div>
  <div class="med-row">
    <div class="med-btn" id="medMorning" onclick="toggleMed('morning')">
      <span class="med-icon">🌅</span>
      <div class="med-name">早上</div>
      <div class="med-state">还没吃</div>
    </div>
    <div class="med-btn" id="medEvening" onclick="toggleMed('evening')">
      <span class="med-icon">🌙</span>
      <div class="med-name">晚上</div>
      <div class="med-state">还没吃</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">⚙️ 提醒设置</div>
  <div class="slider-row">
    <span>⏰</span>
    <input type="range" id="intervalSlider" min="25" max="45" step="5" value="35"
           oninput="onSlider(this.value)" onchange="applyInterval(this.value)">
    <span class="range-val" id="rangeVal">35 分钟</span>
  </div>
</div>

<div class="card">
  <div class="card-title">📊 今日小结</div>
  <div class="stats">
    <div class="stat"><div class="num" id="stretchCount">0</div><div class="lbl">起来活动次数</div></div>
    <div class="stat"><div class="num" id="medStreak">0</div><div class="lbl">连续全勤天数</div></div>
    <div class="stat"><div class="num" id="focusCount">0</div><div class="lbl">专注次数</div></div>
  </div>
</div>

<div class="hint" id="hint">
  💡 小提示：把本页「添加到主屏幕」后，锁屏也能收到提醒（需要 iOS 16.4 以上）。
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <img src="ninibear-cup.png" alt="Ninibear 提醒你喝口水">
    <h2 id="overlayTitle">🐻 起来动动啦！</h2>
    <p id="overlayText">小熊伸了个懒腰：喝口水、活动一下肩颈和腰，2 分钟后再回来～</p>
    <button class="btn btn-primary" style="width:100%" onclick="dismissOverlay()">我起来啦 ✔</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let intervalMin = store.get('nb_interval', 35);
let remaining = intervalMin * 60;
let timerId = null;

function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function renderTimer(){
  $('timerDisplay').textContent = fmt(remaining);
  $('timerLabel').textContent = timerId ? '专注中…到点小熊会喊你' : `每 ${intervalMin} 分钟起来活动一次`;
}
async function toggleTimer(){
  if(timerId){
    clearInterval(timerId); timerId = null;
    $('startBtn').textContent = '继续';
    renderTimer(); return;
  }
  try{
    if('Notification' in window && Notification.permission === 'default'){
      await Notification.requestPermission();
    }
  }catch(e){}
  $('startBtn').textContent = '暂停';
  timerId = setInterval(() => {
    remaining--;
    if(remaining <= 0){ timerComplete(); }
    renderTimer();
  }, 1000);
  renderTimer();
}
function resetTimer(){
  clearInterval(timerId); timerId = null;
  remaining = intervalMin * 60;
  $('startBtn').textContent = '开始';
  renderTimer();
}
function onSlider(v){ $('rangeVal').textContent = `${v} 分钟`; }
function applyInterval(v){
  intervalMin = parseInt(v); store.set('nb_interval', intervalMin);
  if(!timerId){ remaining = intervalMin * 60; }
  renderTimer();
}

function timerComplete(){
  clearInterval(timerId); timerId = null;
  const day = todayStr();
  const log = store.get('nb_log', {});
  log[day] = log[day] || {stretch:0, focus:0};
  log[day].stretch++; log[day].focus++;
  store.set('nb_log', log);
  chime();
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      const n = new Notification('🐻 Ninibear 喊你起来动动！', {body:'喝口水，活动一下肩颈和腰～'});
      setTimeout(()=>n.close(), 8000);
    }
  }catch(e){}
  $('overlayText').textContent = '小熊伸了个懒腰：喝口水、活动一下肩颈和腰，2 分钟后再回来～';
  $('overlay').classList.add('show');
  remaining = intervalMin * 60;
  $('startBtn').textContent = '开始';
  renderStats(); renderTimer();
}
function dismissOverlay(){ $('overlay').classList.remove('show'); }

function chime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i*0.18 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.18 + 0.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*0.18); o.stop(ctx.currentTime + i*0.18 + 0.55);
    });
  }catch(e){}
}

function toggleMed(which){
  const day = todayStr();
  const meds = store.get('nb_meds', {});
  meds[day] = meds[day] || {morning:false, evening:false};
  meds[day][which] = !meds[day][which];
  store.set('nb_meds', meds);
  renderMeds();
}
function renderMeds(){
  const day = todayStr();
  const meds = store.get('nb_meds', {});
  const t = meds[day] || {morning:false, evening:false};
  [['morning','medMorning'],['evening','medEvening']].forEach(([k, id]) => {
    const el = $(id);
    el.classList.toggle('done', !!t[k]);
    el.querySelector('.med-state').textContent = t[k] ? '已吃 ✔ 真棒！' : '还没吃';
  });
  $('medDate').textContent = day;
}

function renderStats(){
  const day = todayStr();
  const log = store.get('nb_log', {});
  $('stretchCount').textContent = (log[day] && log[day].stretch) || 0;
  $('focusCount').textContent = (log[day] && log[day].focus) || 0;
  const meds = store.get('nb_meds', {});
  let streak = 0;
  const d = new Date();
  while(true){
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const m = meds[key];
    if(m && m.morning && m.evening){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  $('medStreak').textContent = streak;
}

$('intervalSlider').value = intervalMin;
$('rangeVal').textContent = `${intervalMin} 分钟`;
remaining = intervalMin * 60;
renderTimer(); renderMeds(); renderStats();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
setInterval(() => { renderMeds(); renderStats(); }, 30000);
</script>
</body>
</html>
